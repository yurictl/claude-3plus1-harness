# Verification-harness configuration — the one file to point at your project.
# Values are space-separated git pathspecs relative to the project root
# (no spaces inside a single path). Sourced by grade-marker.sh,
# hooks/pre-push-grade.sh, hooks/protect-anchors.sh, replay.sh, escape-log.sh.

# Protected paths: changes here are gated on a fresh /review grade.
PROTECTED_PATHS="src"

# The rubric the grader executes.
RUBRIC="docs/operations/conventions.md"

# Calibration material: may not change in the same push as protected paths
# (the weakened-test gate).
CALIBRATION_PATHS="tests/golden docs/operations/conventions.md"

# --- trust anchors -------------------------------------------------------------
# Both are written ONLY by scripts/grade-marker.sh. Hand edits are blocked by
# hooks/pre-push-grade.sh (Bash) and hooks/protect-anchors.sh (Write/Edit).
#   GRADE_MARKER  — content fingerprint of the protected paths at grade time
#   GRADE_RECORD  — the findings record that `stamp` requires as its input;
#                   stamping without a matching record is refused
GRADE_MARKER=".claude/grade-ok"
GRADE_RECORD=".claude/last-grade.json"

# How long a grade record stays stampable (minutes). A record older than this is
# treated as belonging to a past session; re-run /review.
GRADE_RECORD_TTL_MIN="45"

# --- calibration ---------------------------------------------------------------
# Golden-set layout. held-in drives rule authoring; held-out is NEVER consulted
# while writing a rule and exists only to accept rubric changes; clean pins
# precision (zero findings expected).
GOLDEN_ROOT="tests/golden"
GOLDEN_SETS="held-in held-out clean"
GOLDEN_BASELINE="tests/golden/baseline.json"

# Grader models. Pinned to an exact model ID, never a floating alias: `sonnet`
# and `haiku` resolve to whatever the current generation is, so a model release
# would move the catch-rate while the baseline still recorded the same name —
# exactly the silent swap the pin exists to rule out. With a full ID, a rate
# change means a rubric change. Bump these deliberately; replay.sh warns when
# the recorded baseline was graded by a model other than the current pin.
# TIER_CHEAP powers `make replay-tiers`: a rule the cheap model needs and the
# frontier model does not is a rule with a decay curve.
GRADER_MODEL="claude-sonnet-5"
GRADER_MODEL_CHEAP="claude-haiku-4-5-20251001"

# --- local stores (gitignored) --------------------------------------------------
TELEMETRY_DIR=".claude/telemetry"
